configuration:
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port
    description: Only used with an MQTT host. Usually 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only used with an MQTT host.
  mqtt_password:
    name: MQTT password (optional)
    description: Only used with an MQTT host.
  publish_team_selector:
    name: Publish team selector
    description: Also create a select entity so dashboards and automations can switch the tracked team (it includes the live game).
  log_level:
    name: Log level
    description: How chatty the add-on log is. Use debug when troubleshooting.
network:
  8100/tcp: Calendar feed (optional, only for subscribing from a phone or another app)
