configuration:
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port
    description: Only used with an MQTT host. Usually 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only used with an MQTT host.
  mqtt_password:
    name: MQTT password (optional)
    description: Only used with an MQTT host.
  publish_team_selector:
    name: Publish team selector
    description: Also create a select entity so dashboards and automations can switch the tracked team (it includes the live game).
  log_level:
    name: Log level
    description: How chatty the add-on log is. Use debug when troubleshooting.
  backup_enabled:
    name: Backups on
    description: Save your teams and settings to a zip file automatically (a minute after start and then on the schedule below).
  backup_path:
    name: Backup folder
    description: Where the backup zip files are saved. Default /share/team_tracker_lite_backups. Use a folder inside /share.
  backup_keep:
    name: Backups to keep
    description: How many zip files to keep. Older ones are deleted. Default 20.
  backup_interval_hours:
    name: Hours between backups
    description: How often to back up. 0 means only when the add-on starts. No file is made if nothing changed.
  restore_backup:
    name: Restore this backup
    description: File name of a zip in the backup folder, for example team_tracker_lite-20261115-021500.zip. Save, then restart the add-on. The option clears itself after the restore.
network:
  8100/tcp: Calendar feed (optional, only for subscribing from a phone or another app)
