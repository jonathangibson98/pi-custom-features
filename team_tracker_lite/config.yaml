name: "Team Tracker Lite"
version: "0.7.1"
slug: team_tracker_lite
image: "ghcr.io/jonathangibson98/{arch}-addon-team_tracker_lite"
description: "One lightweight sports sensor. Pick any team from a menu."
url: "https://github.com/vasqued2/ha-teamtracker"
arch:
  - aarch64
  - amd64
init: false
ingress: true
stdin: true
hassio_api: true
panel_icon: mdi:scoreboard
panel_title: "Team Tracker"
homeassistant_api: true
map:
  - share:rw
  - addon_config:rw
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Calendar feed. Optional: only needed to subscribe from a phone or another app."
services:
  - "mqtt:want"
options:
  ai_task_entity: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  publish_team_selector: false
  log_level: info
  backup_path: /share/addon_backups/team_tracker_lite
  backup_every: daily
  backup_keep: 10
  wallpaper: ""
schema:
  mqtt_host: "str?"
  mqtt_port: port
  mqtt_username: "str?"
  mqtt_password: "password?"
  publish_team_selector: bool
  log_level: "list(debug|info|warning|error)"
  backup_path: str
  backup_every: list(off|daily|weekly)
  backup_keep: int(1,100)
  wallpaper: str?
  ai_task_entity: str?
