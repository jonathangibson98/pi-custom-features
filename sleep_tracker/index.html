<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0d0d14; color: #e5e7eb; margin: 0; padding: 16px; max-width: 760px; margin: auto; }
  h1 { font-size: 22px; margin: 4px 0; }
  h2 { font-size: 17px; margin: 0; }
  h3 { font-size: 14px; margin: 18px 0 8px; color: #a5b4fc; }
  .muted { color: #9ca3af; font-size: 13px; }
  .card { background: #171727; border: 1px solid #2a2a40; border-radius: 14px; padding: 16px; margin: 14px 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .status { font-size: 26px; font-weight: 700; margin: 10px 0 2px; }
  .asleep { color: #a5b4fc; } .settling { color: #fbbf24; } .awake { color: #fde68a; } .away, .off { color: #6b7280; }
  .bar { height: 10px; background: #2a2a40; border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); border-radius: 99px; }
  .sig { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px solid #22223a; }
  .sig:last-child { border: 0; }
  .yes { color: #86efac; } .no { color: #fca5a5; } .na { color: #6b7280; }
  .night { display: grid; grid-template-columns: 78px 1fr 46px 20px; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
  .nb { height: 14px; background: #2a2a40; border-radius: 6px; overflow: hidden; }
  .nb > div { height: 100%; background: #6366f1; } .nb.nap > div { background: #f59e0b; }
  button { background: #4f46e5; color: white; border: 0; border-radius: 10px; padding: 11px 14px; font-size: 15px; cursor: pointer; }
  button.ghost { background: #2a2a40; } button.small { padding: 6px 10px; font-size: 13px; } button.danger { background: #7f1d1d; }
  button.x { background: transparent; color: #9ca3af; padding: 0 4px; font-size: 16px; }
  button:disabled { opacity: .5; }
  label.f { display: block; font-size: 13px; color: #9ca3af; margin: 10px 0 0; }
  input, select { background: #0d0d14; color: #e5e7eb; border: 1px solid #33334d; border-radius: 8px; padding: 9px; font-size: 16px; width: 100%; margin-top: 4px; }
  input[type=checkbox] { width: auto; margin: 0 6px 0 0; }
  .check { display: flex; align-items: center; font-size: 14px; color: #e5e7eb; margin-top: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .sigedit { border: 1px solid #2a2a40; border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: #12121f; }
  .chip { display: inline-flex; align-items: center; background: #312e81; border-radius: 99px; padding: 3px 4px 3px 10px; font-size: 13px; margin: 6px 6px 0 0; }
  .note { background: #1e1b4b; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  .err { background: #450a0a; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat { background: #12121f; border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 18px; }
  details summary { cursor: pointer; color: #a5b4fc; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="row between"><h1>😴 Sleep Tracker</h1><span class="muted" id="mqtt"></span></div>
<div class="muted">Decides who is asleep from several signals at once, so one phone on a charger doesn't fool it.</div>
<div id="err"></div>
<div id="people"></div>
<div class="card" id="addcard">
  <h2>Track someone</h2>
  <select id="addsel"></select>
  <button id="addbtn" style="margin-top:10px;width:100%">Add and set up</button>
</div>
<div id="editor"></div>
<datalist id="entlist"></datalist>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let D = null, EDIT = null, busy = false;
const MODES = {is: "is one of", is_not: "is not one of", below: "is below", above: "is above", quiet: "hasn't changed for"};
const hrs = m => m == null ? "–" : (Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m");

async function api(path, body) {
  const r = await fetch("api/" + path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  return r.json();
}

async function load() {
  if (busy) return;
  D = await api("state");
  $("#mqtt").textContent = "MQTT: " + D.info.mqtt;
  $("#err").innerHTML = D.error ? `<div class="note err">${esc(D.error)}</div>` : "";
  $("#entlist").innerHTML = D.entities.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join("");
  const tracked = new Set(D.settings.people.map(p => p.id));
  const free = D.people.filter(p => !tracked.has(p.id));
  $("#addcard").hidden = !free.length || !!EDIT;
  $("#addsel").innerHTML = free.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  if (!EDIT) drawPeople();
}

function drawPeople() {
  const box = $("#people");
  if (!D.settings.people.length) { box.innerHTML = `<div class="note">Nobody tracked yet. Pick a person below.</div>`; return; }
  box.innerHTML = D.settings.people.map(p => {
    const s = D.status.find(x => x.id === p.id) || {}, ev = s.eval || {signals: [], score: 0}, sm = s.summary || {recent: []};
    const icon = {asleep: "😴", settling: "🥱", awake: "☀️", away: "🚗", off: "⏸️"}[s.status] || "";
    const last = sm.last;
    const sigs = ev.signals.map(r => `<div class="sig"><span>${esc(r.label)}${r.required ? " <span class='muted'>(must)</span>" : ""}</span>
      <span class="${r.ok === null ? "na" : r.ok ? "yes" : "no"}">${r.ok === null ? "can't tell" : r.ok ? "✓ sleepy" : "✗ awake"} · ${r.weight}</span></div>`).join("") || `<div class="muted">No signals yet. Tap Edit.</div>`;
    const nights = sm.recent.map(r => `<div class="night"><span>${esc(r.day)}${r.nap ? " nap" : ""}</span>
      <div class="nb ${r.nap ? "nap" : ""}" title="${esc(r.from_t)} – ${esc(r.to_t)}"><div style="width:${Math.min(100, r.minutes / 6)}%"></div></div>
      <span>${(r.minutes / 60).toFixed(1)}h</span>${r.provisional ? "<span></span>" : `<button class="x" data-forget="${esc(p.id)}" data-start="${esc(r.start)}" title="Delete this one">×</button>`}</div>`).join("");
    return `<div class="card">
      <div class="row between"><h2>${esc(p.name)}</h2><button class="ghost small" data-edit="${esc(p.id)}">Edit</button></div>
      <div class="status ${s.status}">${icon} ${esc(s.status_text || "Waiting for first check")}</div>
      <div class="muted">${s.since ? "since " + esc(s.since) : ""}${s.status === "asleep" && sm.asleep_for != null ? " · " + hrs(sm.asleep_for) + " so far" : ""}${s.interruptions ? " · up " + s.interruptions + "×" : ""}${s.held ? " · ignoring signals for a bit (marked awake)" : ""}</div>
      <div class="bar"><div style="width:${ev.score}%"></div></div>
      <div class="muted">Sleep confidence ${ev.score}% · falls asleep at ${p.fall_level}%, wakes under ${p.wake_level}%${ev.home === false ? " · not home" : ""}${ev.required_ok === false ? " · a must-be-true signal says awake" : ""}</div>
      <details><summary>Signals right now</summary>${sigs}</details>
      <div class="stats">
        <div class="stat"><b>${last ? (last.minutes / 60).toFixed(1) + "h" : "–"}</b><span class="muted">last sleep</span></div>
        <div class="stat"><b>${last ? esc(last.from_t || "") : "–"}</b><span class="muted">${last ? "to " + esc(last.to_t || "") : "bed / up"}</span></div>
        <div class="stat"><b>${sm.avg_week != null ? (sm.avg_week / 60).toFixed(1) + "h" : "–"}</b><span class="muted">7-night avg</span></div>
      </div>
      ${last && last.interruptions ? `<div class="muted" style="margin-top:6px">Last sleep was interrupted ${last.interruptions}× (${last.awake_minutes} min up)${last.provisional ? ", still counting in case they lie back down" : ""}.</div>` : ""}
      ${nights ? `<h3>Recent</h3>${nights}` : ""}
      <div class="row" style="margin-top:12px"><button class="ghost small" data-mark="asleep" data-id="${esc(p.id)}">😴 Mark asleep now</button><button class="ghost small" data-mark="awake" data-id="${esc(p.id)}">☀️ Mark awake now</button></div>
    </div>`;
  }).join("");
}

$("#people").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) openEdit(JSON.parse(JSON.stringify(D.settings.people.find(p => p.id === b.dataset.edit))));
  if (b.dataset.mark) { b.disabled = true; await api("mark", {id: b.dataset.id, what: b.dataset.mark}); await load(); }
  if (b.dataset.forget) {
    if (b.dataset.armed) { await api("forget", {id: b.dataset.forget, start: b.dataset.start}); await load(); }
    else { b.dataset.armed = 1; b.textContent = "del?"; setTimeout(() => { delete b.dataset.armed; b.textContent = "×"; }, 3000); }
  }
};

$("#addbtn").onclick = () => {
  const id = $("#addsel").value; if (!id) return;
  const nm = (D.people.find(p => p.id === id) || {}).name || id;
  openEdit(Object.assign({}, D.defaults, {id, name: nm, signals: []}), true);
};

/* ---------- editor ---------- */
function openEdit(p, isNew) {
  EDIT = {p, isNew}; busy = true;
  $("#people").innerHTML = ""; $("#addcard").hidden = true;
  drawEdit();
  if (isNew) suggest();
  scrollTo(0, 0);
}

function drawEdit() {
  const p = EDIT.p;
  $("#editor").innerHTML = `<div class="card">
    <div class="row between"><h2>${EDIT.isNew ? "Set up" : "Edit"} ${esc(p.name)}</h2><span class="muted">${esc(p.id)}</span></div>
    <label class="f">Name on the sensors</label><input id="e-name" value="${esc(p.name)}">
    <label class="check"><input type="checkbox" id="e-enabled" ${p.enabled ? "checked" : ""}>Track this person</label>

    <h3>When they sleep</h3>
    <div class="grid2"><div><label class="f">Night starts</label><input type="time" id="e-from" value="${esc(p.night_from)}"></div>
    <div><label class="f">Night ends</label><input type="time" id="e-to" value="${esc(p.night_to)}"></div></div>
    <div class="muted" style="margin-top:6px">They can only fall asleep inside these hours, unless naps are on. Make it wide: it's a window, not a bedtime.</div>
    <label class="check"><input type="checkbox" id="e-home" ${p.home_only ? "checked" : ""}>Only when they're home (leaving = awake)</label>
    <label class="check"><input type="checkbox" id="e-naps" ${p.naps ? "checked" : ""}>Count naps outside night hours</label>

    <h3>Signals</h3>
    <div class="muted">Each signal says "sleepy" or "awake". Weight 1–5 says how much it counts. A <b>must be true</b> signal blocks sleep while it's false and wakes them the moment it turns false (bedroom light on). Entities that are unavailable are skipped.</div>
    <div class="note"><div class="row"><select id="e-area" style="flex:1"><option value="">Bedroom area (optional)</option>${(D.areas || []).map(a => `<option ${a === EDIT.area ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
      <button class="small" id="e-suggest">Suggest signals</button></div>
      <div class="muted" style="margin-top:6px">Looks at ${esc(p.name)}'s phone (charging, Focus, not moving, Android sleep sensors) and the lights, TVs and motion sensors in the area you pick.</div></div>
    <div id="e-sigs"></div>
    <button class="ghost small" id="e-addsig">+ Add a signal</button>

    <details ${EDIT.isNew ? "" : ""}><summary>Fine tuning</summary>
      <div class="grid2">
        <div><label class="f">Falls asleep at (% confidence)</label><input type="number" id="e-fall" value="${p.fall_level}"></div>
        <div><label class="f">Wakes below (%)</label><input type="number" id="e-wake" value="${p.wake_level}"></div>
        <div><label class="f">Must stay sleepy for (min)</label><input type="number" id="e-settle" value="${p.settle_minutes}"></div>
        <div><label class="f">Must stay awake for (min)</label><input type="number" id="e-wakemin" value="${p.wake_minutes}"></div>
        <div><label class="f">Same night if back asleep within (min)</label><input type="number" id="e-grace" value="${p.wake_grace}"></div>
        <div><label class="f">Ignore sleeps shorter than (min)</label><input type="number" id="e-min" value="${p.min_sleep}"></div>
      </div>
      <div class="muted" style="margin-top:6px">The fall-asleep time is dated back to when the signals first agreed, so the settle time doesn't make the night shorter. A bathroom trip shorter than the "same night" time counts as an interruption, not a new night.</div>
    </details>
    <div id="e-msg"></div>
    <div class="row" style="margin-top:14px"><button id="e-save" style="flex:1">Save</button><button class="ghost" id="e-cancel">Cancel</button>${EDIT.isNew ? "" : `<button class="danger" id="e-del">Stop tracking</button>`}</div>
  </div>`;
  drawSigs();
  $("#e-suggest").onclick = suggest;
  $("#e-addsig").onclick = () => { readEdit(); p.signals.push({label: "New signal", entities: [], need: "all", mode: "is", values: ["on"], number: 0, minutes: 10, weight: 1, required: false}); drawSigs(); };
  $("#e-cancel").onclick = close;
  $("#e-save").onclick = save;
  if ($("#e-del")) $("#e-del").onclick = async ev => {
    const b = ev.target;
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Tap again to stop"; return; }
    await saveAll(D.settings.people.filter(x => x.id !== p.id)); close();
  };
}

function drawSigs() {
  const p = EDIT.p;
  $("#e-sigs").innerHTML = p.signals.map((s, i) => `<div class="sigedit" data-i="${i}">
    <div class="row between"><input class="s-label" value="${esc(s.label)}" style="flex:1;margin:0"><button class="x" data-del="${i}" title="Remove">✕</button></div>
    <div>${s.entities.map((e, j) => `<span class="chip">${esc(e)}<button class="x" data-rm="${j}">×</button></span>`).join("")}</div>
    <div class="row" style="margin-top:6px"><input class="s-add" list="entlist" placeholder="Add an entity" style="flex:1;margin:0"><button class="small ghost s-addbtn">Add</button></div>
    <div class="grid2">
      <div><label class="f">${s.entities.length > 1 ? "Sleepy when" : "Entity"}</label><select class="s-need" ${s.entities.length > 1 ? "" : "disabled"}><option value="all" ${s.need === "all" ? "selected" : ""}>all of them</option><option value="any" ${s.need === "any" ? "selected" : ""}>any of them</option></select></div>
      <div><label class="f">Check</label><select class="s-mode">${Object.entries(MODES).map(([k, v]) => `<option value="${k}" ${s.mode === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
    </div>
    ${s.mode === "is" || s.mode === "is_not" ? `<label class="f">States (comma separated)</label><input class="s-values" value="${esc(s.values.join(", "))}">` : ""}
    ${s.mode === "below" || s.mode === "above" ? `<label class="f">Number</label><input type="number" class="s-number" value="${s.number}">` : ""}
    ${s.mode === "quiet" ? `<label class="f">Minutes</label><input type="number" class="s-minutes" value="${s.minutes}">` : ""}
    ${s.mode !== "quiet" ? `<label class="f">Attribute (optional, blank = the state)</label><input class="s-attr" value="${esc(s.attribute || "")}">` : ""}
    <div class="grid2"><div><label class="f">Weight</label><select class="s-weight">${[1, 2, 3, 4, 5].map(w => `<option ${s.weight === w ? "selected" : ""}>${w}</option>`).join("")}</select></div>
    <div><label class="check" style="margin-top:30px"><input type="checkbox" class="s-req" ${s.required ? "checked" : ""}>Must be true</label></div></div>
  </div>`).join("") || `<div class="muted" style="margin:10px 0">No signals yet. Use Suggest signals or add one.</div>`;
}

$("#editor").addEventListener("click", e => {
  const b = e.target.closest("button"), box = e.target.closest(".sigedit"); if (!b || !box) return;
  readEdit(); const s = EDIT.p.signals[+box.dataset.i];
  if (b.dataset.del != null) EDIT.p.signals.splice(+b.dataset.del, 1);
  else if (b.dataset.rm != null) s.entities.splice(+b.dataset.rm, 1);
  else if (b.classList.contains("s-addbtn")) { const v = box.querySelector(".s-add").value.trim(); if (/^[a-z_]+\.[a-z0-9_]+$/.test(v) && !s.entities.includes(v)) s.entities.push(v); }
  else return;
  drawSigs();
});
$("#editor").addEventListener("change", e => { if (e.target.classList.contains("s-mode")) { readEdit(); drawSigs(); } });

function readEdit() {
  const p = EDIT.p, v = id => $(id).value;
  Object.assign(p, {name: v("#e-name").trim() || p.name, enabled: $("#e-enabled").checked, night_from: v("#e-from"), night_to: v("#e-to"),
    home_only: $("#e-home").checked, naps: $("#e-naps").checked, fall_level: +v("#e-fall"), wake_level: +v("#e-wake"),
    settle_minutes: +v("#e-settle"), wake_minutes: +v("#e-wakemin"), wake_grace: +v("#e-grace"), min_sleep: +v("#e-min")});
  EDIT.area = v("#e-area");
  document.querySelectorAll(".sigedit").forEach(box => {
    const s = p.signals[+box.dataset.i], q = c => box.querySelector(c);
    s.label = q(".s-label").value.trim() || s.label; s.need = q(".s-need").value; s.mode = q(".s-mode").value;
    if (q(".s-values")) s.values = q(".s-values").value.split(",").map(x => x.trim()).filter(Boolean);
    if (q(".s-number")) s.number = +q(".s-number").value;
    if (q(".s-minutes")) s.minutes = +q(".s-minutes").value;
    if (q(".s-attr")) s.attribute = q(".s-attr").value.trim();
    s.weight = +q(".s-weight").value; s.required = q(".s-req").checked;
    const pending = q(".s-add").value.trim();  /* typed but not added yet */
    if (/^[a-z_]+\.[a-z0-9_]+$/.test(pending) && !s.entities.includes(pending)) s.entities.push(pending);
  });
}

async function suggest() {
  readEdit();
  const msg = $("#e-msg"); msg.innerHTML = `<div class="note">Looking...</div>`;
  const r = await api("suggest", {id: EDIT.p.id, area: EDIT.area || ""});
  if (!r.ok) { msg.innerHTML = `<div class="note err">${esc(r.error)}</div>`; return; }
  const have = new Set(EDIT.p.signals.map(s => s.entities.join(",")));
  const fresh = r.signals.filter(s => !have.has(s.entities.join(",")));
  EDIT.p.signals.push(...fresh);
  msg.innerHTML = `<div class="note">${fresh.length ? "Added " + fresh.length + " signal" + (fresh.length > 1 ? "s" : "") + ". Check them, then Save." : "Nothing new found." + (EDIT.area ? "" : " Pick the bedroom area for lights, TV and motion.")}</div>`;
  drawSigs();
}

async function saveAll(list) {
  const r = await api("settings", {people: list});
  if (!r.ok) throw new Error("Save failed");
}
async function save() {
  readEdit();
  const p = EDIT.p;
  if (!p.signals.some(s => s.entities.length)) { $("#e-msg").innerHTML = `<div class="note err">Add at least one signal with an entity.</div>`; return; }
  const list = D.settings.people.filter(x => x.id !== p.id);
  const at = D.settings.people.findIndex(x => x.id === p.id);
  list.splice(at < 0 ? list.length : at, 0, p);
  $("#e-save").disabled = true;
  try { await saveAll(list); close(); } catch (e) { $("#e-msg").innerHTML = `<div class="note err">${esc(e.message)}</div>`; $("#e-save").disabled = false; }
}
function close() { EDIT = null; busy = false; $("#editor").innerHTML = ""; setTimeout(load, 300); }

load();
setInterval(load, 15000);
</script>
</body>
</html>
