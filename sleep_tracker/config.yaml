name: Sleep Tracker
version: "1.4.0"
slug: sleep_tracker
description: Tracks whether chosen people are asleep from several signals at once (phone, Focus, lights, TV, motion), with MQTT sensors and sleep history
url: https://github.com/jonathangibson98/pi-custom-features
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
stdin: true
hassio_api: true
panel_icon: mdi:sleep
panel_title: Sleep Tracker
services:
  - mqtt:want
map:
  - share:rw
options:
  ai_task_entity: ""
  check_seconds: 30
  keep_days: 90
  backup_path: /share/addon_backups/sleep_tracker
  backup_every: daily
  backup_keep: 10
  wallpaper: ""
schema:
  check_seconds: int(10,300)
  keep_days: int(0,3650)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  backup_path: str
  backup_every: list(off|daily|weekly)
  backup_keep: int(1,100)
  wallpaper: str?
  ai_task_entity: str?
