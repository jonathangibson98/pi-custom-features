name: "Zone Creator"
version: "1.1.0"
slug: zone_creator
description: "Search an address, drop a pin, and create a Home Assistant zone. Optional AI name and icon suggestions."
url: "https://github.com/jonathangibson98/ha-zone-creator"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-plus
panel_title: "Zone Creator"
options:
  ai_task_entity: ""
  default_radius: 100
schema:
  ai_task_entity: "str?"
  default_radius: "int(10,5000)"
