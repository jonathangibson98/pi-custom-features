name: Publish prebuilt images to GHCR

# Drop this file into any repo at .github/workflows/publish-ghcr.yml.
# It scans the repo and publishes everything it finds to GHCR:
#
#   * Home Assistant add-ons: any folder with a config.yaml/json containing a
#     `slug` plus a Dockerfile. One image per architecture, named from the
#     add-on's `image:` field (or ghcr.io/<owner>/{arch}-addon-<slug>),
#     tagged with the add-on `version` and `latest`.
#   * Plain Docker apps: every other Dockerfile. Multi-arch image named
#     ghcr.io/<owner>/<repo> (root Dockerfile) or ghcr.io/<owner>/<repo>-<folder>.
#
# Publishes on every push to main/master (no tag needed), on v* tags, and on manual runs.
# Add-on images are tagged with the config.yaml `version` and `latest`: bump `version`
# when you want Home Assistant to offer an update. Standalone apps (a Dockerfile.standalone
# next to an add-on's config.yaml) are published as ghcr.io/<owner>/<slug-with-dashes>,
# e.g. voice_chat -> ghcr.io/<owner>/voice-chat, so docker-compose files can pull them.
#
# Optional repo variables (Settings > Secrets and variables > Actions > Variables):
#   DOCKERFILE      force a single plain-Docker Dockerfile instead of scanning
#   DOCKER_CONTEXT  build context for plain-Docker images (default: Dockerfile's folder)
#   PLATFORMS       plain-Docker platforms (default: linux/amd64,linux/arm64)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:

# A newer push cancels a build that is still running for the same branch.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find add-ons and Dockerfiles
        id: find
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          IN_DOCKERFILE: ${{ vars.DOCKERFILE }}
          IN_CONTEXT: ${{ vars.DOCKER_CONTEXT }}
          IN_PLATFORMS: ${{ vars.PLATFORMS }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"
          REPO="${REPO,,}"
          PLATFORMS="${IN_PLATFORMS:-linux/amd64,linux/arm64}"
          entries='[]'
          addon_dirs=()

          # ---------- Home Assistant add-ons ----------
          while IFS= read -r cfg; do
            cfg="${cfg#./}"
            dir="$(dirname "$cfg")"
            cj="$(yq -o=json '.' "$cfg" 2>/dev/null || echo '{}')"
            slug="$(jq -r 'if type=="object" then (.slug // empty) else empty end' <<<"$cj")"
            [ -n "$slug" ] || continue
            if [ "$dir" = "." ]; then df="Dockerfile"; else df="$dir/Dockerfile"; fi
            [ -f "$df" ] || continue

            version="$(jq -r '.version // "latest"' <<<"$cj")"
            name="$(jq -r '.name // empty' <<<"$cj")"; [ -n "$name" ] || name="$slug"
            desc="$(jq -r '.description // empty' <<<"$cj" | tr -d '\n')"
            tmpl="$(jq -r '.image // empty' <<<"$cj")"
            [ -n "$tmpl" ] || tmpl="ghcr.io/$OWNER/{arch}-addon-$slug"

            bj='{}'
            for b in build.yaml build.yml build.json; do
              if [ -f "$dir/$b" ]; then bj="$(yq -o=json '.' "$dir/$b")"; break; fi
            done

            archs="$(jq -r '(.arch // ["amd64","aarch64","armv7"]) | .[]' <<<"$cj")"
            for arch in $archs; do
              case "$arch" in
                amd64)   plat=linux/amd64 ;;
                aarch64) plat=linux/arm64 ;;
                armv7)   plat=linux/arm/v7 ;;
                armhf)   plat=linux/arm/v6 ;;
                i386)    plat=linux/386 ;;
                *) continue ;;
              esac
              image="${tmpl//\{arch\}/$arch}"
              image="${image,,}"
              bf="$(jq -r --arg a "$arch" '.build_from[$a] // empty' <<<"$bj")"
              entries="$(jq -c \
                --arg image "$image" --arg dockerfile "$df" --arg context "$dir" \
                --arg platforms "$plat" --arg arch "$arch" --arg version "$version" \
                --arg build_from "$bf" --arg addon_name "$name" --arg description "$desc" \
                '. + [{kind:"addon", image:$image, dockerfile:$dockerfile, context:$context,
                       platforms:$platforms, arch:$arch, version:$version,
                       build_from:$build_from, addon_name:$addon_name, description:$description}]' \
                <<<"$entries")"
            done
            addon_dirs+=("$dir")

            # Standalone Docker build of the same app (Dockerfile.standalone beside the add-on)
            if [ -f "$dir/Dockerfile.standalone" ]; then
              entries="$(jq -c \
                --arg image "ghcr.io/$OWNER/${slug//_/-}" --arg dockerfile "$dir/Dockerfile.standalone" \
                --arg context "$dir" --arg platforms "$PLATFORMS" --arg version "$version" \
                '. + [{kind:"docker", image:$image, dockerfile:$dockerfile, context:$context,
                       platforms:$platforms, arch:"", version:$version, build_from:"",
                       addon_name:"", description:""}]' \
                <<<"$entries")"
            fi
          done < <(find . -type f \( -name config.yaml -o -name config.yml -o -name config.json \) \
                     -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          # ---------- Plain Docker images ----------
          if [ -n "$IN_DOCKERFILE" ]; then
            list="$IN_DOCKERFILE"
          else
            list="$(find . -type f -name Dockerfile \
                      -not -path './.git/*' -not -path '*/node_modules/*' \
                      | sed 's|^\./||' | sort)"
          fi

          while IFS= read -r df; do
            [ -n "$df" ] && [ -f "$df" ] || continue
            ddir="$(dirname "$df")"
            skip=0
            if [ -z "$IN_DOCKERFILE" ]; then
              for a in "${addon_dirs[@]:-}"; do
                [ -n "$a" ] || continue
                if [ "$a" = "." ] || [ "$ddir" = "$a" ] || [[ "$ddir" == "$a"/* ]]; then skip=1; fi
              done
            fi
            [ "$skip" = 0 ] || continue

            ctx="${IN_CONTEXT:-$ddir}"
            if [ "$ddir" = "." ] || [ -n "$IN_DOCKERFILE" ]; then
              image="ghcr.io/$OWNER/$REPO"
            else
              sub="$(basename "$ddir" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9_.\n-' '-')"
              image="ghcr.io/$OWNER/$REPO-$sub"
            fi
            entries="$(jq -c \
              --arg image "$image" --arg dockerfile "$df" --arg context "$ctx" \
              --arg platforms "$PLATFORMS" \
              '. + [{kind:"docker", image:$image, dockerfile:$dockerfile, context:$context,
                     platforms:$platforms, arch:"", version:"", build_from:"",
                     addon_name:"", description:""}]' \
              <<<"$entries")"
          done <<<"$list"

          if [ "$(jq 'length' <<<"$entries")" = 0 ]; then
            echo "::error::No Dockerfile or Home Assistant add-on found in this repo."
            exit 1
          fi

          echo "Will build:"
          jq -r '.[] | "  - \(.kind): \(.image) [\(.platforms)] from \(.dockerfile)"' <<<"$entries"
          echo "matrix=$(jq -c '{include: .}' <<<"$entries")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.kind }} ${{ matrix.image }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build args
        id: args
        env:
          KIND: ${{ matrix.kind }}
          BUILD_FROM: ${{ matrix.build_from }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ matrix.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo 'build_args<<EOF'
            if [ "$KIND" = addon ]; then
              if [ -n "$BUILD_FROM" ]; then echo "BUILD_FROM=$BUILD_FROM"; fi
              echo "BUILD_ARCH=$ARCH"
              echo "BUILD_VERSION=$VERSION"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [ "$KIND" = addon ] && [ "$REF_TYPE" = tag ] && [ "${REF_NAME#v}" != "$VERSION" ]; then
            echo "::warning::Tag $REF_NAME does not match add-on version $VERSION in config; image will be tagged $VERSION."
          fi

      - name: Metadata (plain Docker)
        id: meta_docker
        if: matrix.kind == 'docker'
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ matrix.version || 'none' }},enable=${{ matrix.version != '' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Metadata (Home Assistant add-on)
        id: meta_addon
        if: matrix.kind == 'addon'
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ matrix.addon_name }}
            io.hass.description=${{ matrix.description }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ matrix.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          build-args: ${{ steps.args.outputs.build_args }}
          tags: ${{ steps.meta_docker.outputs.tags || steps.meta_addon.outputs.tags }}
          labels: ${{ steps.meta_docker.outputs.labels || steps.meta_addon.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
