name: Build SillyTavern add-on image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sillytavern/**"
      - ".github/workflows/build-sillytavern.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64,   runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: echo "version=$(grep '^version:' sillytavern/config.yaml | tr -d '"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sillytavern
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/jonathangibson98/${{ matrix.arch }}-addon-sillytavern:${{ steps.v.outputs.version }}
            ghcr.io/jonathangibson98/${{ matrix.arch }}-addon-sillytavern:latest
