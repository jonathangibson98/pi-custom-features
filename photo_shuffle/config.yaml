name: Photo Hub
version: "5.0.1"
slug: photo_shuffle
image: "ghcr.io/jonathangibson98/{arch}-addon-photo_shuffle"
description: Photo shuffles, Unsplash collections, the shared add-on wallpaper, a Photo Editor with AI tools, and SVG Maker in one place
url: https://github.com/jonathangibson98/my-home-assistant-apps
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
stdin: true
hassio_api: true
panel_icon: mdi:image-edit
panel_title: Photo Hub
services:
  - mqtt:want
map:
  - media:rw
  - share:rw
  - homeassistant_config:rw
  - addon_config:ro
options:
  photo_paths:
    - /media
  formats:
    - jpg
    - png
    - webp
  max_dimension: 1920
  jpeg_quality: 85
  unsplash_interval_minutes: 60
  unsplash_image_size: regular
  backup_path: /share/addon_backups/photo_shuffle
  backup_every: daily
  backup_keep: 10
  wallpaper: ""
  edit_output_path: /media/photo_hub/edited
  svg_output_path: /homeassistant/custom_icons
  svg_temp_path: /homeassistant/www/svg_maker/temp_icons
  svg_auto_delete_temp: false
  svg_auto_delete_after_days: 7
  svg_filename_style: original_timestamp
  svg_on_name_conflict: rename
  svg_default_mode: color
  svg_default_detail: 5
  svg_path_style: spline
  svg_max_image_dimension: 1600
  svg_max_upload_mb: 25
  svg_icon_names: true
  svg_bw_follow_theme: true
  svg_crop_editor: true
  svg_auto_crop: true
  svg_crop_shape: circle
  svg_crop_padding: 15
  svg_output_size: 512
  svg_auto_enhance: true
  svg_ai_task_entity: ai_task.google_ai_task
  svg_ai_timeout: 180
  svg_ai_default_style: flat
  svg_ai_default_count: 1
  ha_url: "http://homeassistant:8123"
schema:
  photo_paths:
    - str
  formats:
    - list(jpg|png|webp|gif|bmp|tiff)
  max_dimension: int(256,4096)
  jpeg_quality: int(30,100)
  unsplash_access_key: password?
  unsplash_interval_minutes: int(5,1440)
  unsplash_image_size: list(full|regular|small)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  backup_path: str
  backup_every: list(off|daily|weekly)
  backup_keep: int(1,100)
  wallpaper: str?
  edit_output_path: str
  photo_ai_image_entity: str?
  photo_ai_data_entity: str?
  svg_output_path: str
  svg_temp_path: str
  svg_auto_delete_temp: bool
  svg_auto_delete_after_days: int(1,365)
  svg_filename_style: list(original|timestamp|original_timestamp)
  svg_on_name_conflict: list(rename|overwrite)
  svg_default_mode: list(color|bw)
  svg_default_detail: int(1,10)
  svg_path_style: list(spline|polygon|none)
  svg_max_image_dimension: int(400,4000)
  svg_max_upload_mb: int(1,100)
  svg_icon_names: bool
  svg_bw_follow_theme: bool
  svg_crop_editor: bool
  svg_auto_crop: bool
  svg_crop_shape: list(circle|rounded|square|none)
  svg_crop_padding: int(0,60)
  svg_output_size: int(128,2048)
  svg_auto_enhance: bool
  svg_ai_task_entity: str
  svg_ai_timeout: int(30,600)
  svg_ai_default_style: list(auto|flat|line|gradient|badge|mascot|geometric|sketch)
  svg_ai_default_count: int(1,3)
  ha_url: str?
  ha_token: password?
