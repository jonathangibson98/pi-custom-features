name: Photo Hub
version: "4.1.0"
slug: photo_shuffle
image: "ghcr.io/jonathangibson98/{arch}-addon-photo_shuffle"
description: Turn folders of photos and Unsplash collections into Home Assistant image entities over MQTT
url: https://github.com/jonathangibson98/my-home-assistant-apps
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:image-multiple
panel_title: Photo Hub
services:
  - mqtt:want
map:
  - media:ro
  - share:rw
  - homeassistant_config:ro
  - addon_config:ro
options:
  photo_paths:
    - /media
  formats:
    - jpg
    - png
    - webp
  max_dimension: 1920
  jpeg_quality: 85
  unsplash_interval_minutes: 60
  unsplash_image_size: regular
  backup_enabled: true
  backup_path: /share/photo_shuffle_backups
  backup_keep: 20
  backup_interval_hours: 24
  restore_backup: ""
schema:
  photo_paths:
    - str
  formats:
    - list(jpg|png|webp|gif|bmp|tiff)
  max_dimension: int(256,4096)
  jpeg_quality: int(30,100)
  unsplash_access_key: password?
  unsplash_interval_minutes: int(5,1440)
  unsplash_image_size: list(full|regular|small)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  backup_enabled: bool
  backup_path: str
  backup_keep: int(1,200)
  backup_interval_hours: int(0,720)
  restore_backup: str?
