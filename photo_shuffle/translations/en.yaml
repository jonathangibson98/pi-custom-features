configuration:
  photo_paths:
    name: Allowed photo paths
    description: Folders the add-on may read for folder shuffles. Must start with /media, /share, /homeassistant or /addon_configs.
  formats:
    name: Picture formats
    description: Which picture types folder shuffles include. jpg covers .jpg and .jpeg.
  max_dimension:
    name: Max image size (px)
    description: Longest side of every picture sent to Home Assistant, folder or Unsplash. Larger photos are scaled down.
  jpeg_quality:
    name: JPEG quality
    description: Quality of the published JPEG (30 to 100).
  unsplash_access_key:
    name: Unsplash Access Key (optional)
    description: Needed only for Unsplash collections. Use the Access Key, not the Secret Key, from unsplash.com/developers.
  unsplash_interval_minutes:
    name: Unsplash refresh interval (minutes)
    description: How often every Unsplash collection gets a fresh photo. Each image costs one request, and the free tier allows 50 per hour.
  unsplash_image_size:
    name: Unsplash download size
    description: Which Unsplash size to download before it is resized. regular (about 1080px) is plenty for most dashboards.
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Defaults to 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only needed with a manual MQTT broker.
  mqtt_password:
    name: MQTT password (optional)
    description: Only needed with a manual MQTT broker.
  backup_enabled:
    name: Backups on
    description: Save your shuffles, collections and settings to a zip file automatically. Your photos are not copied.
  backup_path:
    name: Backup folder
    description: Where the backup zip files are saved. Default /share/photo_shuffle_backups. Use a folder inside /share.
  backup_keep:
    name: Backups to keep
    description: How many zip files to keep. Older ones are deleted. Default 20.
  backup_interval_hours:
    name: Hours between backups
    description: How often to back up. 0 means only when the add-on starts. No file is made if nothing changed.
  restore_backup:
    name: Restore this backup
    description: File name of a zip in the backup folder, for example photo_shuffle-20261115-021500.zip. Save, then restart the add-on. The option clears itself after the restore.
