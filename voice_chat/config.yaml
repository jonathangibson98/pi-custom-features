name: Voice Chat
version: "2.2.1"
slug: voice_chat
image: "ghcr.io/jonathangibson98/{arch}-addon-voice_chat"
description: Hands-free voice conversation with any Home Assistant AI agent, answered out loud on the speaker you choose
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:microphone-message
panel_title: Voice Chat
homeassistant_api: true
map:
  - ssl:ro
ports:
  8443/tcp: null
ports_description:
  8443/tcp: Direct HTTPS page (only starts when a password is set)
options:
  conversation_agent: conversation.home_assistant
  media_player: ""
  tts_entity: ""
  stt_entity: ""
  language: ""
  hands_free: true
  silence_ms: 1200
  volume: 0
  password: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
  wake_word: ""
  stop_words: "stop listening,goodbye,never mind,cancel"
  sensitivity: normal
  chimes: true
  idle_timeout_s: 120
  browser_playback: true
  save_history: true
  history_limit: 100
  context_enabled: true
  context_entity: sensor.combined_info
  context_attributes: "household_text,friends_text,notable_people,places"
  context_skip_agents: conversation.home_assistant
  context_max_chars: 40000
  speaker_name: ""
schema:
  conversation_agent: str
  media_player: str?
  tts_entity: str
  stt_entity: str?
  language: str?
  hands_free: bool
  silence_ms: int(400,5000)
  volume: float(0,1)
  password: password?
  certfile: str
  keyfile: str
  wake_word: str?
  stop_words: str?
  sensitivity: list(low|normal|high)
  chimes: bool
  idle_timeout_s: int(0,3600)
  browser_playback: bool
  save_history: bool
  history_limit: int(10,1000)
  context_enabled: bool?
  context_entity: str?
  context_attributes: str?
  context_skip_agents: str?
  context_max_chars: int(0,200000)?
  speaker_name: str?
