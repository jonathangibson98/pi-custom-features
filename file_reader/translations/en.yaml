configuration:
  files_path:
    name: Files folder
    description: >-
      Folder where your files are stored. Must start with /data, /share, /media,
      /homeassistant or /config (for example /share/file_reader). Use a dedicated
      subfolder, because every file in it becomes an MQTT sensor.
  scan_interval:
    name: Scan interval (seconds)
    description: >-
      How often the add-on checks the folder for files you changed outside the
      add-on (Samba, File editor, other add-ons). Default 30.
  api_token:
    name: REST API token
    description: >-
      Password for the REST API on port 8100 (for rest_command, curl and scripts).
      Leave empty to keep the REST API turned off. MQTT updates do not need it.
  mqtt_host:
    name: MQTT host
    description: Hostname of your MQTT broker. The default works with the Mosquitto add-on.
  mqtt_port:
    name: MQTT port
    description: Port of your MQTT broker (usually 1883).
  mqtt_user:
    name: MQTT username
    description: Leave empty to use the Mosquitto add-on login from Home Assistant automatically.
  mqtt_password:
    name: MQTT password
    description: Leave empty if your broker has no login.
  backup_enabled:
    name: Backups on
    description: Save your files to a zip file automatically (a minute after start and then on the schedule below).
  backup_path:
    name: Backup folder
    description: Where the backup zip files are saved. Default /share/file_reader_backups. Use a folder this add-on can write to, such as one inside /share.
  backup_keep:
    name: Backups to keep
    description: How many zip files to keep. Older ones are deleted. Default 20.
  backup_interval_hours:
    name: Hours between backups
    description: How often to back up. 0 means only when the add-on starts. No file is made if nothing changed.
  restore_backup:
    name: Restore this backup
    description: File name of a zip in the backup folder, for example file_reader-20261115-021500.zip. Save, then restart the add-on. The option clears itself after the restore.
network:
  8100/tcp: REST API port (needs api_token)
