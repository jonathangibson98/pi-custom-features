configuration:
  ai_task_entity:
    name: AI Task entity (optional)
    description: The Home Assistant AI Task entity behind the ✨ AI button. Leave empty to use the first one Home Assistant has.
  save_folder:
    name: Save folder
    description: >-
      Where the hours files are saved (one CSV per person). Must start with
      /homeassistant/, /share/ or /media/. The folder is created automatically.
  keep_days:
    name: Keep data for (days)
    description: >-
      Rows older than this are deleted automatically. Set to 0 to keep
      everything forever.
  check_seconds:
    name: Check every (seconds)
    description: How often each person's location is checked.
  grace_minutes:
    name: Grace period (minutes)
    description: >-
      How long someone can be outside the zone before the shift is ended.
      Stops GPS wobble and quick errands from splitting a shift.
  min_minutes:
    name: Ignore visits shorter than (minutes)
    description: Drive-bys and short stops under this length are not logged.
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto broker add-on automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Only used with a custom MQTT host. Defaults to 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only used with a custom MQTT host.
  mqtt_password:
    name: MQTT password (optional)
    description: Only used with a custom MQTT host.
  backup_path:
    name: Backup folder
    description: >-
      Where backups are saved, inside /share, /media or /homeassistant. A folder keeps several dated backups.
      A path ending in .zip keeps one file that is replaced each time. Open Backups in the add-on page to back up,
      download or restore.
  backup_every:
    name: Automatic backups
    description: How often a backup is made by itself (off, daily or weekly).
  backup_keep:
    name: Backups to keep
    description: The newest this many backups are kept in the folder, older ones are deleted.
  wallpaper:
    name: Wallpaper
    description: >-
      Background image for this add-on's web UI. Leave empty to use your Home Assistant theme's wallpaper, "none" for no wallpaper, or an image: put it in /config/www and enter its file name (pic.jpg) or /local/pic.jpg, or a full https:// link.
  separate_sensors:
    name: Keep the separate "at work" and "day off" sensors
    description: >-
      Off by default: each person has one sensor (sensor.NAME_hours) that shows everything in its attributes, including whether they are at work and whether today is a day off. Turn this on to also keep the older binary sensors NAME at work and NAME day off.
