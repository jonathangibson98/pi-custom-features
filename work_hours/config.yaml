name: Work Hours Tracker
version: "1.5.0"
slug: work_hours
image: "ghcr.io/jonathangibson98/{arch}-addon-work_hours"
description: Logs time spent in chosen zones, one file per person, with MQTT sensors
url: https://github.com/jonathangibson98/my-home-assistant-apps
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:clock-check-outline
panel_title: Work Hours
services:
  - mqtt:want
map:
  - homeassistant_config:rw
  - share:rw
  - media:rw
options:
  save_folder: /homeassistant/work_hours
  keep_days: 365
  check_seconds: 30
  grace_minutes: 10
  min_minutes: 5
  backup_enabled: true
  backup_path: /share/work_hours_backups
  backup_keep: 20
  backup_interval_hours: 24
  restore_backup: ""
schema:
  save_folder: str
  keep_days: int(0,36500)
  check_seconds: int(10,300)
  grace_minutes: int(0,120)
  min_minutes: int(0,120)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  backup_enabled: bool
  backup_path: str
  backup_keep: int(1,200)
  backup_interval_hours: int(0,720)
  restore_backup: str?
