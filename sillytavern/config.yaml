name: SillyTavern
version: "1.19.0"
slug: sillytavern
description: LLM frontend for power users - chat, characters, lorebooks, any AI backend
url: https://github.com/SillyTavern/SillyTavern
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: SillyTavern web UI
webui: "http://[HOST]:[PORT:8000]"
watchdog: "tcp://[HOST]:[PORT:8000]"
map:
  - addon_config:rw
options:
  admin_password: ""
schema:
  admin_password: password
