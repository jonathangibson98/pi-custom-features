name: SillyTavern
version: "1.19.1"
slug: sillytavern
description: LLM frontend for power users - chat, characters, lorebooks, any AI backend
url: https://github.com/SillyTavern/SillyTavern
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false

# Prebuilt image from GitHub Actions: HA pulls it and shows download progress.
# The tag must match "version" above.
image: ghcr.io/jonathangibson98/{arch}-addon-sillytavern

# Sidebar (ingress). The icon is read by Home Assistant from this file, not from
# the options, so it can't be a runtime option. Change it here, reload the add-on
# store and rebuild. Any https://pictogrammers.com/library/mdi/ icon works.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:drama-masks
panel_title: SillyTavern

# Direct access stays available on 8000 (clear it in the Network tab to close it).
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: SillyTavern web UI (direct access, optional)
watchdog: "tcp://[HOST]:[PORT:8000]"
map:
  - addon_config:rw
  - share:rw
options:
  admin_password: ""
  log_level: info
  extensions_plugins_path: ""
schema:
  admin_password: password
  log_level: list(debug|info|warning|error)
  extensions_plugins_path: str?
