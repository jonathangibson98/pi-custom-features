configuration:
  log_level:
    name: Log level
    description: How chatty the add-on log is. Use debug when troubleshooting, warning or error to keep it quiet.
  ai_task_entity:
    name: AI task entity
    description: The Home Assistant ai_task entity used to write configs and announcements, for example ai_task.google_ai_task.
  request_timeout:
    name: AI request timeout (seconds)
    description: How long to wait for the AI before giving up (30 to 600).
  match_entity_id:
    name: Change the entity id when a name changes
    description: When an announcement, fact or other item is renamed here, also change its entity id to match (script.my_old_name becomes script.my_new_name). Anything in Home Assistant that used the old entity id must then be updated by you. You can also tick this per rename.
  template_file:
    name: Template sensor file
    description: Where template sensors are written, relative to your Home Assistant config folder. Must end in .yaml.
  appdaemon_apps_dir:
    name: AppDaemon apps folder
    description: Your AppDaemon apps folder. Must be under /addon_configs or your Home Assistant config folder.
  ha_token:
    name: Long-lived access token (optional)
    description: Leave blank unless the default Supervisor access to Home Assistant fails.
  ha_url:
    name: Home Assistant URL
    description: Only used when a long-lived access token is set.
  helper_ai_task_entity:
    name: Announcement helper AI task (optional)
    description: A separate ai_task entity for the Announcements helper tab. Blank uses the Announcements AI task.
  backup_path:
    name: Backup path
    description: Where Backup saves to and imports from. A folder (each save makes a new dated file, for example /share/ai_builder_backups) or a single .json file (each save overwrites it). Use a folder under /share, /media, /backup or /homeassistant so it survives an uninstall.
  backup_keep:
    name: Backups to keep
    description: When backup_path is a folder, the newest this many ai_builder_backup_*.json files are kept and older ones are deleted.
  facts_file_path:
    name: Facts file path
    description: The MQTT topic folder where Facts saves its text files, for example file_reader/overwrite/ (a fact named random_fact.txt is saved as file_reader/overwrite/random_fact.txt). When set here it wins over the Facts settings page. Letters, numbers, underscores, dashes, dots and slashes only.
  wallpaper:
    name: Wallpaper
    description: >-
      Background image for this add-on's web UI. Leave empty to use your Home Assistant theme's wallpaper, "none" for no wallpaper, or an image: put it in /config/www and enter its file name (pic.jpg) or /local/pic.jpg, or a full https:// link.
  files_path:
    name: Files folder
    description: >-
      Folder for the Files section (the old File Reader). Every text file in it becomes an MQTT sensor. Must start
      with /share, /media, /homeassistant, /config, /addon_configs or /data. If you used File Reader with a folder
      this add-on can see, it is picked up by itself; its private files are copied over from its newest backup.
  files_scan_interval:
    name: Files scan interval (seconds)
    description: How often the Files folder is checked for changes made outside the add-on (Samba, File editor). Default 30.
  files_api_token:
    name: Files REST API token
    description: >-
      Password for the Files REST API on port 8100 (rest_command, curl, scripts). Leave empty to keep it off. Also
      set a host port for 8100 under Network if you call it from outside Home Assistant. MQTT updates don't need it.
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Usually 1883.
  mqtt_user:
    name: MQTT username (optional)
    description: Leave empty to use the Mosquitto add-on login from Home Assistant automatically.
  mqtt_password:
    name: MQTT password (optional)
    description: Only for your own broker.
network:
  8100/tcp: Files REST API (needs files_api_token)
