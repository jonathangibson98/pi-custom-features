<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator &amp; AI Builder</title>
<link rel="stylesheet" href="ui.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px}
  .brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem}
  header .tabs{margin:0;border:0;flex:1}
  header .tab{padding:14px 14px}
  #frames{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  @media (max-width:560px){.brand span{display:none}header{gap:8px}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>&#9656;</i><span>Creator &amp; AI Builder</span></div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" id="b-builder" data-t="builder">Build</button>
    <button class="tab" id="b-announcements" data-t="announcements">Announcements</button>
    <button class="tab" id="b-facts" data-t="facts">Facts</button>
    <button class="tab" id="b-cards" data-t="cards">Cards</button>
    <button class="tab" id="b-backup" data-t="backup">Backup</button>
  </nav>
</header>
<div id="frames">
  <iframe id="f-builder" title="Build" hidden></iframe>
  <iframe id="f-announcements" title="Announcements" hidden></iframe>
  <iframe id="f-facts" title="Facts" hidden></iframe>
  <iframe id="f-cards" title="Cards" hidden></iframe>
  <iframe id="f-backup" title="Backup" hidden></iframe>
</div>
<script>
const TABS = ["builder", "announcements", "facts", "cards", "backup"];
function show(t) {
  if (!TABS.includes(t)) t = "builder";
  for (const k of TABS) {
    const f = document.getElementById("f-" + k);
    if (k === t && !f.getAttribute("src")) f.setAttribute("src", k);  /* load each page the first time it is opened, then keep it alive */
    f.hidden = k !== t;
    document.getElementById("b-" + k).classList.toggle("on", k === t);
  }
  try { localStorage.setItem("aib_tab", t); } catch (e) {}
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => show(b.dataset.t)));
let start = location.hash.slice(1);
if (!TABS.includes(start)) { try { start = localStorage.getItem("aib_tab"); } catch (e) {} }
show(start);
</script>
</body>
</html>
