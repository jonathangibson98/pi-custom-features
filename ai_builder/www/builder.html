<!-- ha-theme v1.0.0: copied from .shared/ha-theme.js, edit it there -->
<script>
/* HA Theme Bridge v1.0.0
 * Makes an add-on web UI follow the active Home Assistant theme (colors, dark/light,
 * dashboard wallpaper, glass blur, card corners and shadows) and updates live when
 * the theme changes. It reads the theme from the Home Assistant page that holds the
 * add-on (ingress runs on the same origin) and remaps this page's own colors to it.
 * Opened outside Home Assistant it does nothing, so the page keeps its own look.
 * Opt out on a page: <html data-ha-theme-off>
 * Variables you can use in new pages: --hb-bg --hb-card --hb-text --hb-text2 --hb-line
 * --hb-primary --hb-accent --hb-on --hb-error --hb-warning --hb-success --hb-field,
 * plus every core HA variable (--primary-color, --card-background-color, ...).
 */
(function () {
  'use strict';
  if (window.__haThemeBridge) return;
  window.__haThemeBridge = 1;
  var doc = document, root = doc.documentElement;
  if (root.hasAttribute('data-ha-theme-off')) return;

  /* ---------- find the Home Assistant window above us ---------- */
  var HA = null;
  try {
    var w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (w.document && w.document.querySelector('home-assistant')) HA = w;
    }

  var nested = window.parent !== HA;

  /* ---------- color helpers ---------- */
  function parse(c) {
    if (!c) return null;
    c = String(c).trim().toLowerCase();
    var m;
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (!/^[0-9a-f]+$/.test(h)) return null;
      if (h.length === 3 || h.length === 4) h = h.replace(/./g, '$&$&');
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),

        return /%$/.test(v) ? parseFloat(v) * (alpha ? 0.01 : 2.55) : parseFloat(v);

      for (var i = 0; i < 4; i++) if (isNaN(out[i])) return null;
      return out;

    if (c === 'black') return [0, 0, 0, 1];

  function info(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), ch = mx - mn, h = 0;

      else if (mx === g) h = (b - r) / ch + 2;
      else h = (r - g) / ch + 4;
      h *= 60;
      if (h < 0) h += 360;

    return { l: (mx + mn) / 2, ch: ch, h: h, a: c[3] };

  /* greys, plus the dark navy/indigo shades many dark UIs use as their "grey" */
  function isNeutral(i) {
    return i.ch < 0.12 || (i.ch < 0.2 && i.h >= 200 && i.h <= 290 && (i.l < 0.32 || i.l > 0.85));
  }
  function lum(c) { return c ? (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 : 0; }

  }
  function tint(role, a) { return 'rgba(var(--hb-' + role + '-rgb),' + (Math.round(a * 1000) / 1000) + ')'; }

  var probe = null;
  function toRGB(v) {
    v = (v || '').trim();
    if (!v) return null;
    var p = parse(v);
    if (p) return p;
    if (!probe) {
      probe = doc.createElement('i');
      probe.style.display = 'none';
      (doc.body || root).appendChild(probe);
    }
    probe.style.color = '';
    probe.style.color = v;

    return parse(getComputedStyle(probe).color);

  /* ---------- what the page looked like before we touched it ---------- */
  var REFS = { dark: { b: 0.08, t: 0.92 }, light: { b: 0.96, t: 0.12 } };
  var designScheme = 'dark';
  (function measure() {
    var el = doc.body || root, cs = getComputedStyle(el);
    var txt = parse(cs.color), bg = parse(cs.backgroundColor);

    else if (bg && bg[3] > 0.5) designScheme = info(bg).l < 0.5 ? 'dark' : 'light';

  /* ---------- color rewriting rules ---------- */
  var COLOR_RE = /#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|\b(?:white|black)\b/g;
  var cardVars = {}, solidVars = {}, pageVars = {};

  function lastCompound(sel) {
    return (sel || '').split(',').map(function (s) {
      var parts = s.trim().split(/\s*[\s>+~]\s*/);

  function kindOf(sel) {
    var lasts = lastCompound(sel), k = '';
    for (var i = 0; i < lasts.length; i++) {

      if (/\.(overlay|backdrop|scrim|mask|shade|sheet|modal|lightbox)\b|::backdrop/.test(s)) return 'scrim';
      if (/^(input|select|textarea)\b|\.(input|field-input|textfield)\b/.test(s)) k = k || 'input';
      else if (/^(header|nav|footer)\b|\.(top|topbar|nav|navbar|header|footer|bar|toolbar|appbar|bottom|tabbar|savebar)\b/.test(s)) k = k || 'bar';

  /* returns {v, solid, card} or null to leave the color alone */

    var i = info(c), a = i.a, dark = ref.b < 0.5;
    if (a === 0) return null;

        if (t > 0.5) return { v: tint('text', a) };            /* light-on-dark wash -> text tint */
        if (ctx !== 'bg' || kind === 'scrim') return null;     /* overlays and shadows stay */
        if (i.l < 0.05 && a < 0.5) return { v: 'var(--hb-inset)' };  /* black wash = inset box */
        if (i.l < 0.05) return null;
        if (kind === 'bar' || a > 0.8) return { v: 'var(--hb-bar)', card: true };
        if (kind === 'card' || a > 0.4) return { v: 'var(--hb-card)', card: true };
        return { v: 'var(--hb-inset)' };
      }
      if (ctx === 'text') return { v: t > 0.72 ? 'var(--hb-text)' : 'var(--hb-text2)' };
      if (ctx === 'line') return { v: 'var(--hb-line)' };
      if (ctx === 'accent') return { v: 'var(--hb-primary)' };
      if (kind === 'page') return { v: 'var(--hb-bg)' };
      if (kind === 'input') return { v: 'var(--hb-field)' };
      if (kind === 'bar') return { v: 'var(--hb-bar)', card: true };
      if (kind === 'card' && t < 0.45) return { v: 'var(--hb-card)', card: true };
      if (at < 0.04) return { v: 'var(--hb-inset)' };
      if (t > 0.6) return null;                                 /* bright chip on dark page: leave */
      return { v: tint('text', clamp(0.03 + at * 0.4, 0.05, 0.16)) };
    }
    var role = hueRole(i.h);
    if (a < 0.98) return { v: tint(role, a) };
    if (ctx === 'bg') {
      if (dark ? i.l < 0.3 : i.l > 0.82) return { v: tint(role, 0.2) };   /* tinted note/chip bg */
      return { v: 'var(--hb-' + role + ')', solid: true };
    }
    return { v: 'var(--hb-' + role + ')' };
  }

  var SEM_NAMES = [
    [/^(ok|good|success|live|green|pos|positive)(-?\d)?$/, 'success'],
    [/^(bad|red|danger|err|error|neg|negative)(-?\d)?$/, 'error'],
    [/^(warn|warning|amber)(-?\d)?$/, 'warning'],
    [/^(acc|accent|ac|primary|brand|link)$/, 'primary'],
    [/^(acc|accent|ac|primary)-?2$/, 'accent']
  ];
  function mapVar(name, val, ref) {
    var n = name.slice(2).toLowerCase();
    if (/^hb-/.test(n)) return null;
    var c = parse(val);
    if (!c) return null;
    var i = info(c), neutral = isNeutral(i), dark = ref.b < 0.5;
    var span = ref.t - ref.b, t = span ? (i.l - ref.b) / span : 0, at = Math.abs(t);
    if (n === 'on' || /^(acc|accent|ac|primary)-?(ink|on|fg|text)$|^on-(acc|accent|primary)$/.test(n)) return { v: 'var(--hb-on)' };
    var soft = /(-|^)(soft|tint|wash|bg|bg2|weak)$|soft$/.test(n), base = n.replace(/-?(soft|tint|wash|bg|bg2|weak|ink)$|soft$/, '');
    for (var k = 0; k < SEM_NAMES.length; k++) {
      if (SEM_NAMES[k][0].test(base) && (!neutral || base !== n)) {
        var role = SEM_NAMES[k][1];

        if (soft || i.a < 0.98) return { v: tint(role === 'accent' ? 'primary' : role, i.a < 0.98 ? i.a : 0.16) };
        return { v: 'var(--hb-' + role + ')', solid: true };
      }
    }
    if (/-ink$/.test(n)) return { v: 'var(--hb-text)' };
    if (!neutral) return null;                                 /* unknown colorful var (state colors): leave */
    if (i.a < 0.98) return t > 0.5 ? { v: tint('text', i.a) } : null;
    if (/line|border|sep|divid|rule|stroke|outline/.test(n)) return { v: 'var(--hb-line)' };
    if (/^(mut|muted|dim|mu|sub|sec|secondary|faint|hint|txt2|text2|tx2|ink2|subtle)(-?\d)?$/.test(n)) return { v: 'var(--hb-text2)' };
    if (/^(text|txt|tx|fg|fore|ink|c|font-color|text-color)(-?\d)?$/.test(n) && t > 0.3) return { v: t > 0.72 ? 'var(--hb-text)' : 'var(--hb-text2)' };
    if (/field|input|code|well/.test(n)) return { v: 'var(--hb-field)' };
    if (/chip|card-?2|panel-?2|surface-?2|bg-?3|raised|hover|alt|elev/.test(n)) return { v: tint('text', dark ? 0.08 : 0.06) };
    if (/card|panel|surface|sheet|tile|box|pane/.test(n)) return { v: 'var(--hb-card)', card: true };
    if (/^(bg|bg-?[0-2]|background|base|page|canvas|app-bg|ink)$/.test(n) || at < 0.04) return { v: 'var(--hb-bg)' };
    if (t > 0.72) return { v: 'var(--hb-text)' };
    if (t > 0.4) return { v: 'var(--hb-text2)' };
    return { v: tint('text', clamp(0.03 + at * 0.4, 0.05, 0.14)) };
  }

  function refVarNames(v) {
    var out = [], re = /var\(\s*(--[\w-]+)/g, m;
    while ((m = re.exec(v || ''))) out.push(m[1]);
    return out;

  function doStyle(st, sel, scheme) {
    var ref = REFS[scheme], kind = kindOf(sel), names = [], k;
    for (k = 0; k < st.length; k++) names.push(st[k]);
    var solidBg = false, isCard = false;
    names.forEach(function (p) {
      var v = st.getPropertyValue(p), pr = st.getPropertyPriority(p);
      if (p.indexOf('--') === 0) {
        var r = mapVar(p, v, ref);
        pageVars[p] = 1;
        if (r) {
          if (r.card) cardVars[p] = 1;
          if (r.solid) solidVars[p] = 1;
          st.setProperty(p, r.v, pr);
        }
        return;
      }
      var ctx = ctxOf(p);
      if (!ctx || !v) return;
      var nv = v.replace(COLOR_RE, function (tok) {
        var c = parse(tok);
        if (!c) return tok;
        var r = mapColor(c, ctx, ref, kind);
        if (!r) return tok;
        if (ctx === 'bg' && r.solid) solidBg = true;
        if (ctx === 'bg' && r.card) isCard = true;
        return r.v;
      });
      if (nv !== v) st.setProperty(p, nv, pr);
    });
    /* shorthands that mix var() with literal colors only show up on the shorthand itself */
    ['background', 'border', 'border-top', 'border-right', 'border-bottom', 'border-left', 'outline'].forEach(function (p) {
      var v = st.getPropertyValue(p);
      if (!v || v.indexOf('var(') < 0) return;
      var ctx = p === 'background' ? 'bg' : 'line', pr = st.getPropertyPriority(p);
      var nv = v.replace(COLOR_RE, function (tok) {
        var c = parse(tok), r = c && mapColor(c, ctx, REFS[scheme], kind);
        if (!r) return tok;
        if (ctx === 'bg' && r.card) isCard = true;
        return r.v;
      });
      if (nv !== v) st.setProperty(p, nv, pr);
    });
    /* backgrounds written as var(--card) / var(--accent) */
    ['background', 'background-color', 'background-image'].forEach(function (p) {
      refVarNames(st.getPropertyValue(p)).forEach(function (n) {
        if (cardVars[n]) isCard = true;
        if (solidVars[n]) solidBg = true;
      });
    });
    if (solidBg) {
      var col = st.getPropertyValue('color');
      if (!col || /var\(--hb-text2?\)/.test(col) || refVarNames(col).some(function (n) {
        return /^--(text|txt|tx|ink|fg|c)$/.test(n);

      st.setProperty('backdrop-filter', 'var(--hb-blur)');

  function schemeOfMedia(text, fallback) {

  function baseScheme(rules) {

  /* ---------- read the HA theme and publish it as variables ---------- */
  var CORE = ['primary-color', 'dark-primary-color', 'light-primary-color', 'accent-color', 'text-primary-color',
    'primary-text-color', 'secondary-text-color', 'disabled-text-color', 'text-light-primary-color',
    'primary-background-color', 'secondary-background-color', 'card-background-color', 'ha-card-background',
    'divider-color', 'error-color', 'warning-color', 'success-color', 'info-color', 'state-icon-color',
    'paper-item-icon-color', 'sidebar-background-color', 'sidebar-text-color', 'app-header-background-color',
    'app-header-text-color', 'ha-card-border-radius', 'ha-card-box-shadow', 'ha-card-border-color',
    'ha-card-border-width', 'primary-font-family', 'paper-font-body1_-_font-family', 'lovelace-background',
    'input-fill-color', 'mdc-theme-primary', 'switch-checked-color', 'table-row-background-color',
    'table-row-alternative-background-color', 'code-editor-background-color', 'markdown-code-background-color'];
  var BLUR_VARS = ['ha-card-backdrop-filter', 'card-backdrop-filter', 'ha-card-backdrop', 'backdrop-filter',
    'glass-blur', 'ha-blur', 'blur', 'card-blur', 'ha-card-blur'];
  var MOD_VARS = ['card-mod-card', 'card-mod-card-yaml', 'card-mod-root', 'card-mod-view', 'card-mod-row'];

  function themeSource() {

  }

    for (i = 0; i < st.length; i++) if (st[i].indexOf('--') === 0) names.push(st[i].slice(2));

    th.text = toRGB(g('primary-text-color')) || (lum(th.bg) < 0.5 ? [225, 225, 225, 1] : [33, 33, 33, 1]);
    th.text2 = toRGB(g('secondary-text-color')) || th.text;
    th.cardRaw = g('ha-card-background') || g('card-background-color');
    th.card = toRGB(th.cardRaw) || th.bg2;
    th.line = g('divider-color') || 'rgba(' + rgbStr(th.text) + ',.12)';
    th.primary = toRGB(g('primary-color')) || [3, 169, 244, 1];
    th.accent = toRGB(g('accent-color')) || th.primary;
    th.on = toRGB(g('text-primary-color')) || [255, 255, 255, 1];
    th.error = toRGB(g('error-color')) || [219, 68, 55, 1];
    th.warning = toRGB(g('warning-color')) || [255, 166, 0, 1];
    th.success = toRGB(g('success-color')) || [67, 160, 71, 1];
    th.info = toRGB(g('info-color')) || [3, 155, 229, 1];

    Object.keys(th.vars).forEach(function (n) {
      if (pageVars[n]) return;
      root.style.setProperty(n, th.vars[n]);
      copied[n] = 1;
    });

    var cardSame = Math.abs(lum(th.card) - lum(th.bg)) < 0.01 && th.card[3] > 0.95 && !th.wall;
    set('--hb-bg', th.wall ? 'rgba(' + rgbStr(th.bg) + ',.45)' : css(th.bg));
    set('--hb-bg2', css(th.bg2));
    set('--hb-card', cardSame ? 'rgba(' + rgbStr(th.text) + ',.05)' : (th.cardRaw && !toRGB(th.cardRaw) ? th.cardRaw : css(th.card)));
    set('--hb-text', css(th.text));
    set('--hb-text2', css(th.text2));
    set('--hb-line', th.line);
    set('--hb-primary', css(th.primary));
    set('--hb-accent', css(th.accent));
    set('--hb-on', css(th.on));
    ['error', 'warning', 'success', 'info'].forEach(function (k) { set('--hb-' + k, css(th[k])); });
    ['text', 'bg', 'primary', 'accent', 'error', 'warning', 'success', 'info'].forEach(function (k) {
      set('--hb-' + k + '-rgb', rgbStr(th[k]));
    });
    set('--hb-field', 'rgba(' + rgbStr(th.text) + ',' + (th.dark ? '.07' : '.05') + ')');
    set('--hb-inset', 'rgba(' + rgbStr(th.bg) + ',' + (th.wall ? '.35' : '.6') + ')');
    set('--hb-bar', th.card[3] < 0.95 || th.wall ? 'var(--hb-card)' : 'rgba(' + rgbStr(th.bg) + ',.92)');
    set('--hb-blur', th.blur || 'none');
    set('--hb-radius', th.radius);
    set('--hb-shadow', th.shadow);
    set('--hb-card-border', th.cardBorder);
    set('--hb-page', th.wall || css(th.bg));
    root.style.setProperty('color-scheme', th.dark ? 'dark' : 'light');
    root.classList.toggle('hb-dark', th.dark);
    root.classList.toggle('hb-light', !th.dark);
    root.classList.toggle('hb-wallpaper', !!th.wall);
    root.classList.toggle('hb-glass', !!th.blur);

    var s = doc.getElementById('hb-style');
    if (!s) {
      s = doc.createElement('style');
      s.id = 'hb-style';
      (doc.head || root).appendChild(s);
    }
    var page = nested && th.wall ? 'transparent' : 'var(--hb-page)';
    s.textContent =
      'html.hb-themed{background:' + page + ' !important;min-height:100%}' +
      'html.hb-themed body{background:transparent !important;color:var(--hb-text)}' +
      (th.wall ? 'html.hb-themed iframe{background:transparent !important}' : '') +
      'html.hb-themed ::placeholder{color:var(--hb-text2);opacity:.8}';
    root.classList.add('hb-themed');
  }

  /* ---------- run now, then follow changes ---------- */
  function run() { try { processSheets(); } catch (e) {} apply(); }
  run();
  var tm = null;
  function later() { clearTimeout(tm); tm = setTimeout(run, 120); }
  try {
    var mo = new HA.MutationObserver(later);
    mo.observe(HA.document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
    mo.observe(themeSource(), { attributes: true, attributeFilter: ['style', 'class'] });
    if (HA.document.head) mo.observe(HA.document.head, { childList: true, subtree: true, characterData: true });
    var mq = HA.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', later); else if (mq.addListener) mq.addListener(later);
  } catch (e) {}
  try {
    new MutationObserver(function (list) {
      for (var i = 0; i < list.length; i++) {
        for (var j = 0; j < list[i].addedNodes.length; j++) {
          var n = list[i].addedNodes[j];
          if (n.id === 'hb-style') continue;
          if (n.tagName === 'STYLE') later();
          if (n.tagName === 'LINK') n.addEventListener('load', later);
        }
      }
    }).observe(doc.head || root, { childList: true });
  } catch (e) {}
  doc.addEventListener('visibilitychange', function () { if (!doc.hidden) later(); });
  window.addEventListener('load', later);
  window.haThemeBridge = { refresh: function () { lastKey = ''; run(); } };
})();
</script>
<!-- /ha-theme -->

<main class="page narrow">
  <div class="head">
    <div>
      <h1>Build</h1>
      <p class="sub">Say what you want in plain English. Your AI task entity writes it, you read it, then create it.</p>
    </div>
    <span class="pill plain" id="conn">Connecting...</span>
  </div>
  <div id="banners" class="stack" style="margin-bottom:14px"></div>

  <nav class="tabs">
    <button class="tab on" data-tab="build">New request</button>
    <button class="tab" data-tab="mine">Made so far</button>
  </nav>

  <section id="build" class="stack">
    <div class="card">
      <label class="l" for="req">What do you want?</label>
      <textarea id="req" placeholder="When the entry temperature passes 76 and someone is home, run the fans for 20 minutes. / A Movie Night scene. / An AppDaemon app that texts me when the garage is open 10 minutes."></textarea>

      <label class="l kindrow">Make it as</label>
      <div class="chips" id="kinds"></div>

      <label class="l kindrow" for="target">Or change something that already exists</label>
      <select id="target"><option value="">Nothing, make something new</option></select>
      <p class="help">Pick one and describe the change above. The AI gets its current config to edit.</p>

      <button class="btn primary wide" id="go" style="margin-top:16px">Build it</button>
    </div>
    <div id="out" class="stack"></div>
  </section>

  <section id="mine" class="stack" hidden></section>
</main>

<script src="ui.js"></script>
<script>
const KINDS = [["auto","Let AI decide"],["automation","Automation"],["scene","Scene"],["script","Script"],["template","Template sensor"],["helper","Helper"],["appdaemon","AppDaemon app"],["pyscript","Pyscript"],["blueprint","Blueprint"],["addon","Add-on"]];
const KIND_LABEL = {automation:"Automation", scene:"Scene", script:"Script", template:"Template entity", helper:"Helper", appdaemon:"AppDaemon app", pyscript:"Pyscript", blueprint:"Blueprint", addon:"Add-on", announcement:"Announcement", fact:"Fact", answer:"Answer"};
let kind = "auto", current = null, targets = [];

function renderChips() {
  const box = $("#kinds"); box.replaceChildren();
  for (const [k, label] of KINDS) box.append(el("button", {class: "chip" + (k === kind ? " on" : ""), onclick: () => { kind = k; renderChips(); }}, label));
}

async function init() {
  renderChips();
  const s = await api("status");
  const b = $("#banners"), c = $("#conn");
  if (s.error) { c.textContent = "Offline"; c.className = "pill bad"; b.append(el("div", {class: "note bad"}, s.error)); return; }
  if (s.ha_ok && s.entity_found) { c.className = "pill ok"; c.textContent = "Connected" + (s.version ? " · HA " + s.version : ""); c.title = "Using " + s.entity; }
  else { c.className = "pill warn"; c.textContent = s.ha_ok ? "AI task not found" : "Waiting for Home Assistant"; }
  if (!s.ha_ok) b.append(el("div", {class: "note warn"}, "Can't talk to Home Assistant yet. Give it a minute and reload."));
  if (s.ha_ok && !s.entity_found) b.append(el("div", {class: "note warn"}, "Can't find " + s.entity + ". Fix the AI task entity name in the add-on's Configuration tab."));
  if (!s.package_included) {
    const f = s.template_file || "ai_builder/package.yaml";
    b.append(el("div", {class: "note warn"}, el("div", {},
      el("b", {}, "Template sensors need a one-time setup"),
      el("p", {class: "dim small", style: "margin-top:4px"}, "Everything else works now. Add this to configuration.yaml, then restart Home Assistant. If you already have a packages: section, add only the last line under it. If you load a packages folder with !include_dir_named, set the template_file option to a file inside it instead."),
      el("pre", {}, "homeassistant:\n  packages:\n    ai_builder: !include " + f))));
  }
  targets = await api("targets");
  const sel = $("#target");
  if (Array.isArray(targets)) {
    let grp = null, last = "";
    targets.forEach((t, i) => {
      if (t.kind !== last) { last = t.kind; grp = el("optgroup", {label: (KIND_LABEL[t.kind] || t.kind) + "s"}); sel.append(grp); }
      grp.append(el("option", {value: i}, t.name));
    });
  }
}

const chosenTarget = () => { const v = $("#target").value; return v === "" ? null : {kind: targets[v].kind, id: targets[v].id}; };
const busy = msg => $("#out").replaceChildren(el("div", {class: "card"}, el("span", {class: "spin"}), msg));

async function generate(feedback) {
  const request = $("#req").value.trim();
  if (!request) { $("#req").focus(); return; }
  $("#go").disabled = true;
  busy(feedback ? "Revising..." : "Thinking. Some AI backends take a minute or two.");
  const body = {request, kind, target: chosenTarget()};
  if (feedback && current) { body.previous = {summary: current.summary, items: current.items.map(i => ({kind: i.kind, id: i.id, summary: i.summary, config: i.config}))}; body.feedback = feedback; }
  const res = await api("generate", body);
  $("#go").disabled = false;
  if (res.error) {
    const c = el("div", {class: "card tone-bad"}, el("b", {class: "bad"}, "That didn't work"), el("p", {style: "margin-top:6px"}, res.error));
    if (res.raw) c.append(el("details", {}, el("summary", {}, "What the AI said"), el("pre", {}, res.raw)));
    $("#out").replaceChildren(c); return;
  }
  current = res; renderResult();
}

function itemCard(it) {
  const card = el("div", {class: "card"});
  const title = it.config.alias || it.config.name || it.config.slug || it.config.filename || (it.kind === "answer" ? "" : "Untitled");
  card.append(el("div", {class: "row"}, el("span", {class: "pill acc plain"}, KIND_LABEL[it.kind] || it.kind), title ? el("b", {}, title) : null));
  if (it.kind === "answer") { card.append(el("p", {style: "white-space:pre-wrap;margin-top:10px"}, it.config.text || it.summary)); return card; }
  if (it.summary) card.append(el("p", {class: "dim", style: "margin:8px 0"}, it.summary));
  const c = it.checks || {}, notes = el("div", {class: "stack", style: "margin-top:8px"});
  if (c.preview != null) notes.append(el("div", {class: "note ok"}, el("div", {}, "Right now this would show: " + c.preview)));
  if (c.error) notes.append(el("div", {class: "note bad"}, el("div", {}, "Problem: " + c.error)));
  for (const f of c.fixes || []) notes.append(el("div", {class: "note ok"}, el("div", {}, "Fixed automatically: " + f)));
  for (const n of c.notes || []) notes.append(el("div", {class: "note warn"}, el("div", {}, "Heads up: " + n)));
  if (c.unknown && c.unknown.length) notes.append(el("div", {class: "note warn"}, el("div", {}, "Not found in your Home Assistant: " + c.unknown.join(", "))));
  if (notes.children.length) card.append(notes);
  card.append(el("details", {style: "margin-top:8px"}, el("summary", {}, "See the code"), el("pre", {}, it.yaml || "")));
  const status = el("div", {class: "msg"});
  const isEdit = it.edit_id || (it.kind === "template" && it.config.unique_id && targets.some(t => t.id === it.config.unique_id));
  const btn = el("button", {class: "btn good", onclick: () => make(it, btn, status)}, isEdit ? "Save changes" : "Create");
  const copy = el("button", {class: "btn", onclick: async () => { try { await navigator.clipboard.writeText(it.yaml); copy.textContent = "Copied"; } catch (e) { copy.textContent = "Press and hold the code to copy"; } }}, "Copy");
  card.append(el("div", {class: "row", style: "margin-top:12px"}, btn, copy), status);
  it._btn = btn; it._status = status;
  return card;
}

async function make(it, btn, status, overwrite) {
  btn.disabled = true; status.replaceChildren(el("span", {class: "spin"}), "Creating...");
  const r = await api("create", {overwrite: !!overwrite, item: {kind: it.kind, id: it.id, edit_id: it.edit_id, config: it.config}});
  if (r.ok) {
    btn.textContent = "Done";
    status.replaceChildren(el("div", {class: "ok"}, "Done" + (r.entity ? ": " + r.entity : "") + "."));
    if (r.note) status.append(el("div", {class: "dim"}, r.note));
    if (r.needs_setup) status.append(el("div", {class: "warn"}, "It won't show up until you add the one-time packages line (see the top of this page) and restart Home Assistant."));
    return true;
  }
  btn.disabled = false;
  if (r.exists) {
    status.replaceChildren(el("div", {class: "warn"}, r.error + " Overwriting keeps a backup copy of the old file."),
      el("div", {class: "row", style: "margin-top:8px"}, el("button", {class: "btn", onclick: () => make(it, btn, status, true)}, "Overwrite it")));
    return false;
  }
  status.replaceChildren(el("div", {class: "bad"}, "That failed: " + r.error),
    el("div", {class: "row", style: "margin-top:8px"}, el("button", {class: "btn", onclick: () => { $("#fix").value = "Home Assistant rejected it with this error, please fix it: " + r.error; refine(); }}, "Ask AI to fix it")));
  return false;
}

function renderResult() {
  const out = $("#out"); out.replaceChildren();
  if (current.summary) out.append(el("div", {class: "card tone-ok"}, el("b", {}, "What I built"), el("p", {style: "margin-top:6px"}, current.summary)));
  for (const w of current.warnings || []) out.append(el("div", {class: "note warn"}, el("div", {}, "Heads up: " + w)));
  current.items.forEach(it => out.append(itemCard(it)));
  const makeable = current.items.filter(i => i.kind !== "answer");
  if (makeable.length > 1)
    out.append(el("button", {class: "btn primary wide", onclick: async e => {
      e.target.disabled = true;
      const order = {helper:0, template:1, scene:2, script:2, pyscript:3, appdaemon:3, automation:4, blueprint:5, addon:5};
      for (const it of [...makeable].sort((a, b) => order[a.kind] - order[b.kind])) { if (!(await make(it, it._btn, it._status))) break; }
      e.target.disabled = false;
    }}, "Create all " + makeable.length));
  out.append(el("div", {class: "card"},
    el("label", {class: "l", for: "fix"}, "Not quite right? Say what to change"),
    el("input", {id: "fix", placeholder: "Only run on weekdays, and use the Entry fan instead"}),
    el("div", {class: "row", style: "margin-top:10px"}, el("button", {class: "btn", onclick: refine}, "Revise"))));
}
function refine() { const f = $("#fix").value.trim(); if (f) generate(f); }

async function renderMine() {
  const box = $("#mine"); box.replaceChildren(el("div", {class: "dim"}, "Loading..."));
  const d = await api("mine"); box.replaceChildren();
  if (d.error) { box.append(el("div", {class: "note bad"}, d.error)); return; }
  const RENAMABLE = ["script", "automation", "scene", "input_boolean", "input_number", "input_select", "input_text", "input_datetime", "counter", "timer"];
  const t = el("div", {class: "card"}, el("div", {class: "ch"}, el("h2", {}, "Template sensors I manage"), el("p", {}, "Stored in the template file. Don't edit that file by hand.")));
  if (!d.templates.length) t.append(el("p", {class: "dim"}, "None yet."));
  const tl = el("div", {class: "list"});
  for (const x of d.templates) {
    const del = el("button", {class: "btn danger sm"}, "Delete");
    confirmTap(del, "Tap again", async () => { await api("delete_template", {id: x.id}); renderMine(); });
    tl.append(el("div", {class: "li"}, el("div", {class: "t"}, el("b", {}, x.name), el("span", {class: "dim"}, "  " + x.platform)),
      renameButton(x.name, n => api("rename", {kind: "template", id: x.id, name: n}), renderMine), del));
  }
  t.append(tl); box.append(t);

  /* announcements, facts and cards made in the other tabs, renamed here or there and kept in step */
  const TABNAME = {announcement: "Announcements", fact: "Facts", card: "Cards"}, LIBK = {announcement: "ann", fact: "facts", card: "cards"};
  const made = d.made || [];
  const m = el("div", {class: "card"}, el("div", {class: "ch"}, el("h2", {}, "Made in the other tabs"),
    el("p", {}, "Rename one here and it changes in Home Assistant and in its own tab. Rename it in Home Assistant and the add-on picks the new name up.")));
  if (!made.length) m.append(el("p", {class: "dim"}, "Nothing yet."));
  const ml = el("div", {class: "list"});
  for (const x of made) {
    const open = el("button", {class: "btn sm", onclick: () => { try { window.parent.show(TABNAME[x.kind].toLowerCase()); } catch (e) { /* not inside the add-on page */ } }}, "Open " + TABNAME[x.kind]);
    ml.append(el("div", {class: "li srcrow"}, el("div", {class: "t"}, el("b", {}, x.name),
      el("div", {class: "dim small"}, TABNAME[x.kind].replace(/s$/, "") + (x.entity ? " · " + x.entity : "") + (x.file && x.file.sensor ? " · writes " + x.file.sensor : "") + (x.kind !== "card" && !x.pushed ? " · draft" : ""))),
      renameButton(x.name, n => api("rename", {lib: LIBK[x.kind], id: x.id, name: n}), renderMine), open));
  }
  m.append(ml); box.append(m);

  const h = el("div", {class: "card"}, el("div", {class: "ch"}, el("h2", {}, "Recently created"), el("p", {}, "Names are the ones Home Assistant shows now.")));
  if (!d.history.length) h.append(el("p", {class: "dim"}, "Nothing yet."));
  const hl = el("div", {class: "list"});
  for (const x of d.history) {
    const can = x.exists && x.cfg_id && RENAMABLE.includes(x.kind_ha) && !["announcement", "fact"].includes(x.kind);
    hl.append(el("div", {class: "li srcrow"}, el("div", {class: "t"}, el("b", {}, x.name || x.entity),
      el("div", {class: "dim small"}, (KIND_LABEL[x.kind] || x.kind) + (x.entity ? " · " + x.entity : "") + (x.exists === false ? " · not in Home Assistant any more" : ""))),
      el("span", {class: "dim small"}, ago(x.time)),
      can ? renameButton(x.name, n => api("rename", {kind: x.kind_ha, id: x.cfg_id, entity: x.entity, name: n}), renderMine) : null));
  }
  h.append(hl); box.append(h);
}
onChanged(() => { if (!$("#mine").hidden) renderMine(); });

$$(".tab").forEach(b => b.addEventListener("click", () => {
  $$(".tab").forEach(x => x.classList.toggle("on", x === b));
  $("#build").hidden = b.dataset.tab !== "build"; $("#mine").hidden = b.dataset.tab !== "mine";
  if (b.dataset.tab === "mine") renderMine();
}));
$("#go").addEventListener("click", () => generate());
init();
</script>
</body>
